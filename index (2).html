<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>申惟娃娃的小屋 · V2</title>
<style>
:root{
  --cream:#fff9f2; --cream2:#fff2e8; --pink:#ff9fb2; --pink2:#ffd2dc;
  --brown:#6e4b3d; --line:#f2d7c7; --gold:#f4b43e; --shadow:0 12px 30px #8b5b4530;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--brown)}
body{
  background:
    radial-gradient(circle at 20% 10%,#fff8dd 0 12%,transparent 30%),
    linear-gradient(135deg,#ffdce5,#fff3dc 55%,#f9d8d0);
  padding:12px;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.game{width:min(1180px,100%);margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.brand,.coins,.pill,.panel{
  background:#fffaf4e8;border:2px solid #fff;box-shadow:var(--shadow);
  backdrop-filter:blur(10px)
}
.brand{padding:10px 16px;border-radius:22px;font-weight:900}
.coins{padding:9px 16px;border-radius:22px;font-weight:900}
.stage{display:grid;grid-template-columns:88px minmax(0,1fr) 270px;gap:12px;align-items:stretch}
.leftnav{display:flex;flex-direction:column;gap:10px}
.navbtn{border-radius:24px;padding:13px 6px;background:#fffaf4e8;border:2px solid #fff;box-shadow:var(--shadow);font-weight:800}
.navbtn span{display:block;font-size:27px;margin-bottom:4px}
.navbtn.on{background:#ffd2dc}
.room{
  position:relative;min-height:620px;overflow:hidden;border-radius:34px;border:4px solid #fff;
  box-shadow:0 20px 55px #7b4d3738;
  background:
    linear-gradient(180deg,transparent 0 66%,#dba06e 66% 100%);
  isolation:isolate;
}
.wall{
  position:absolute;inset:0 0 34% 0;
  background:
    radial-gradient(circle at 15% 20%,#fff9d8aa 0 3%,transparent 4%),
    linear-gradient(90deg,#f7d6d1,#fbe5cf 55%,#f7d4ce);
}
.wall:after{
  content:"";position:absolute;left:8%;right:8%;bottom:10%;height:2px;background:#e7bba8aa;
}
.window{
  position:absolute;left:53%;top:7%;width:29%;height:33%;border:12px solid #d39a68;border-radius:12px;
  background:linear-gradient(#9fd5f4,#eaf7ff 60%,#b9d999);box-shadow:inset 0 0 0 4px #f6d7aa,0 8px 20px #7b54372b
}
.window:before,.window:after{content:"";position:absolute;background:#d39a68}
.window:before{left:47%;top:0;width:7%;height:100%}.window:after{left:0;top:47%;width:100%;height:7%}
.curtain{position:absolute;top:3%;width:12%;height:43%;background:repeating-linear-gradient(90deg,#fff0c9 0 10px,#ffdba7 10px 20px);opacity:.72;filter:drop-shadow(0 5px 8px #7b543722)}
.c1{left:45%}.c2{left:79%}
.bed{position:absolute;left:5%;bottom:22%;width:35%;height:26%;border-radius:32px 32px 20px 20px;background:#d4a26f;box-shadow:var(--shadow)}
.bed:before{content:"";position:absolute;inset:13% 3% 0;border-radius:25px;background:repeating-linear-gradient(0deg,#f9b9c6 0 20px,#ffd9df 20px 40px);border:9px solid #fff3e7}
.bed:after{content:"🌼  🍓";position:absolute;left:19%;top:17%;font-size:34px;letter-spacing:18px}
.shelf{position:absolute;right:5%;top:10%;width:14%;height:43%;background:#bd865b;border:8px solid #dca979;border-radius:12px;box-shadow:var(--shadow)}
.shelf:after{content:"📚  🐰\A 🪴  📖\A 🧸  🌷";white-space:pre;position:absolute;inset:10% 8%;font-size:27px;line-height:2.35;text-align:center}
.rug{position:absolute;left:28%;bottom:4%;width:48%;height:25%;border-radius:50%;background:radial-gradient(circle,#fff8e8 0 12%,#f6b8c8 13% 20%,#fff7e7 21% 42%,#f7c5d0 43% 51%,#fff8e8 52%);filter:drop-shadow(0 8px 8px #81543924)}
.table{position:absolute;left:21%;bottom:16%;width:17%;height:7%;border-radius:50%;background:#c99061;box-shadow:0 9px 0 #a66f48}
.table:after{content:"🌼  ☕";position:absolute;left:18%;top:-34px;font-size:28px}
.box{position:absolute;right:17%;bottom:13%;width:18%;height:14%;border-radius:10px;background:#c99668;border:5px solid #e0b184}
.box:after{content:"🐰";font-size:38px;position:absolute;left:38%;top:25%}
.hero{
  position:absolute;width:16%;left:52%;top:78%;transform:translate(-50%,-100%);
  z-index:30;transition:left var(--d,.55s) ease,top var(--d,.55s) ease;
  filter:drop-shadow(0 12px 10px #6b46383d)
}
.hero img{display:block;width:100%;transform-origin:50% 100%;animation:idle 2.2s ease-in-out infinite alternate}
.hero.walk img{animation:walk .28s ease-in-out infinite alternate}
@keyframes idle{to{transform:translateY(-4px) scale(1.015)}}
@keyframes walk{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-7px)}}
.bubble{position:absolute;left:50%;bottom:102%;transform:translateX(-50%);white-space:nowrap;background:#fffaf3;border:3px solid #fff;border-radius:18px;padding:6px 12px;box-shadow:var(--shadow);font-weight:800;opacity:0;transition:.2s}
.bubble.show{opacity:1}
.mess{position:absolute;font-size:36px;z-index:25;cursor:pointer;filter:drop-shadow(0 5px 5px #6f4b3a33);animation:wiggle .7s infinite alternate}
@keyframes wiggle{to{transform:rotate(8deg) scale(1.06)}}
.shop{padding:14px;border-radius:28px;min-height:620px}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:12px}
.tabs button{background:#fff1e9;border-radius:14px;padding:8px 10px;white-space:nowrap;font-weight:800}
.tabs button.on{background:#ff9fb2;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.item{background:#fff1ed;border-radius:20px;padding:10px;text-align:center;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.item .emoji{font-size:39px;filter:drop-shadow(0 5px 5px #6f4b3a22)}
.item small{font-weight:900;margin:5px 0}
.item button{background:#fff;border-radius:12px;padding:4px 10px;font-weight:900}
.bottom{display:grid;grid-template-columns:1fr 1.35fr;gap:12px;margin-top:12px}
.tasks,.dialogue{border-radius:25px;padding:12px 16px}
.tasks b{display:inline-block;background:#ff9fb2;color:#fff;border-radius:16px;padding:5px 12px;margin-bottom:6px}
.task{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0ddd2;font-size:14px}
.dialogue{display:flex;align-items:center;gap:12px;font-weight:900;font-size:18px}
.avatar{width:56px;height:56px;border-radius:50%;background:#ffe8a6;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:contain}
.hint{font-size:12px;opacity:.7;margin-top:8px;text-align:center}
@media(max-width:850px){
  body{padding:6px}.stage{grid-template-columns:64px 1fr}.shop{grid-column:1/-1;min-height:0}.room{min-height:520px}
  .navbtn{font-size:12px}.navbtn span{font-size:23px}.bottom{grid-template-columns:1fr}.hero{width:23%}
}
@media(max-width:560px){
  .room{min-height:460px}.stage{gap:7px}.shop{padding:10px}.grid{grid-template-columns:repeat(3,1fr)}
  .item{min-height:95px;padding:6px}.item .emoji{font-size:31px}.brand{font-size:13px}.hero{width:28%}
}
</style>
</head>
<body>
<div class="game">
  <div class="topbar">
    <div class="brand">🍓 申惟娃娃的小屋 <small>V2</small></div>
    <div class="coins">🪙 <span id="coins">100</span></div>
  </div>

  <div class="stage">
    <div class="leftnav">
      <button class="navbtn on" id="decorateBtn"><span>🛋️</span>装饰</button>
      <button class="navbtn" id="tidyBtn"><span>🧹</span>收拾</button>
      <button class="navbtn" id="photoBtn"><span>📷</span>拍照</button>
    </div>

    <div class="room" id="room">
      <div class="wall"></div><div class="window"></div><div class="curtain c1"></div><div class="curtain c2"></div>
      <div class="bed"></div><div class="shelf"></div><div class="rug"></div><div class="table"></div><div class="box"></div>
      <div class="hero" id="hero">
        <div class="bubble" id="bubble">你好呀～</div>
        <img src="shinyu-plush.png" alt="申惟娃娃">
      </div>
    </div>

    <aside class="shop panel" id="shopPanel">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
      <div class="hint">V3 会把这里的 emoji 家具全部换成毛绒 PNG 素材</div>
    </aside>
  </div>

  <div class="bottom">
    <div class="tasks panel">
      <b>今日任务</b>
      <div class="task"><span>收拾 5 个杂物</span><span id="tidyProgress">0/5 · +50</span></div>
      <div class="task"><span>购买 1 件家具</span><span id="buyProgress">0/1 · +50</span></div>
      <div class="task"><span>和娃娃走一走</span><span id="walkProgress">0/1 · +30</span></div>
    </div>
    <div class="dialogue panel">
      <div class="avatar"><img src="shinyu-plush.png"></div>
      <span id="message">点地板，娃娃会走过去 ♡</span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const room=$("room"), heroEl=$("hero"), bubble=$("bubble");
const MESS=["🧦","📄","🥤","🍎","👕","📦"];
const CAT={
  "家具":[["🛏️","草莓小床",30],["🛋️","奶油沙发",25],["🪑","小椅子",10],["📺","复古电视",30],["🧸","小熊",15],["🪞","镜子",18]],
  "装饰":[["🌷","郁金香",8],["🖼️","挂画",8],["💡","小台灯",10],["📚","小书堆",8],["🎀","蝴蝶结",6],["🍓","草莓抱枕",8]],
  "植物":[["🪴","绿植",8],["🌻","向日葵",6],["🌵","仙人掌",5],["🌸","小花",6]]
};
let S={coins:100,items:[],bought:0,tidied:0,walked:0};
try{S={...S,...JSON.parse(localStorage.getItem("shinyuV2")||"{}")}}catch(e){}
let mode="decorate", mess=[], hero={x:52,y:78}, cat="家具", uid=Date.now();

function save(){localStorage.setItem("shinyuV2",JSON.stringify(S))}
function msg(t){$("message").textContent=t}
function talk(t){
  bubble.textContent=t;bubble.classList.add("show");
  clearTimeout(talk.t);talk.t=setTimeout(()=>bubble.classList.remove("show"),1800)
}
function updateHUD(){
  $("coins").textContent=S.coins;
  $("tidyProgress").textContent=`${Math.min(S.tidied,5)}/5 · +50`;
  $("buyProgress").textContent=`${Math.min(S.bought,1)}/1 · +50`;
  $("walkProgress").textContent=`${Math.min(S.walked,1)}/1 · +30`;
}
function go(x,y,cb){
  x=Math.max(12,Math.min(88,x)); y=Math.max(55,Math.min(92,y));
  const d=Math.hypot(x-hero.x,y-hero.y), t=Math.max(.28,d/55);
  heroEl.style.setProperty("--d",t+"s");
  heroEl.style.left=x+"%";heroEl.style.top=y+"%";
  heroEl.querySelector("img").style.transform=(x<hero.x?"scaleX(-1)":"");
  heroEl.classList.add("walk");hero={x,y};
  if(!S.walked){S.walked=1;S.coins+=30;save();updateHUD()}
  clearTimeout(go.t);go.t=setTimeout(()=>{heroEl.classList.remove("walk");cb&&cb()},t*1000)
}
function renderItems(){
  room.querySelectorAll(".placed,.mess").forEach(n=>n.remove());
  S.items.forEach(i=>{
    const n=document.createElement("div");n.className="placed";n.textContent=i.e;
    n.style.cssText=`position:absolute;left:${i.x}%;top:${i.y}%;font-size:${i.s}px;z-index:${Math.round(i.y)};transform:translate(-50%,-50%);cursor:grab;filter:drop-shadow(0 5px 5px #6f4b3a33)`;
    n.onpointerdown=e=>drag(e,i,n);room.appendChild(n)
  });
  mess.forEach(m=>{
    const n=document.createElement("div");n.className="mess";n.textContent=m.e;
    n.style.left=m.x+"%";n.style.top=m.y+"%";
    n.onclick=e=>{e.stopPropagation();go(m.x,m.y+4,()=>tidy(m))};room.appendChild(n)
  })
}
function drag(e,i,n){
  if(mode!=="decorate")return;e.preventDefault();e.stopPropagation();
  const r=room.getBoundingClientRect();
  const mv=ev=>{i.x=(ev.clientX-r.left)/r.width*100;i.y=(ev.clientY-r.top)/r.height*100;n.style.left=i.x+"%";n.style.top=i.y+"%"}
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);save()}
  addEventListener("pointermove",mv);addEventListener("pointerup",up)
}
function spawn(){
  if(mess.length)return;
  for(let i=0;i<5;i++)mess.push({e:MESS[Math.floor(Math.random()*MESS.length)],x:15+Math.random()*70,y:62+Math.random()*27});
  msg("点地上的杂物，娃娃会跑过去收拾");talk("这里有点乱呀…");renderItems()
}
function tidy(m){
  mess=mess.filter(x=>x!==m);S.coins+=5;S.tidied++;
  if(S.tidied===5){S.coins+=50;talk("收拾干净啦 ♡");msg("今日收拾任务完成！+50")}
  else talk("嘿咻～");
  save();updateHUD();renderItems()
}
function buildShop(){
  $("tabs").innerHTML="";
  Object.keys(CAT).forEach(k=>{
    const b=document.createElement("button");b.textContent=k;b.className=k===cat?"on":"";
    b.onclick=()=>{cat=k;buildShop()};$("tabs").appendChild(b)
  });
  $("grid").innerHTML="";
  CAT[cat].forEach(([e,name,p])=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML=`<div class="emoji">${e}</div><small>${name}</small><button>🪙 ${p}</button>`;
    d.querySelector("button").onclick=()=>buy(e,name,p);
    $("grid").appendChild(d)
  })
}
function buy(e,name,p){
  if(S.coins<p){talk("金币不够啦…");return}
  S.coins-=p;S.bought++;S.items.push({id:uid++,e,name,x:48+Math.random()*18,y:69+Math.random()*15,s:38});
  if(S.bought===1)S.coins+=50;
  save();updateHUD();renderItems();talk("新东西！");msg(`${name} 已经放进房间，可以拖动它`)
}
$("decorateBtn").onclick=()=>{mode="decorate";$("decorateBtn").classList.add("on");$("tidyBtn").classList.remove("on");$("shopPanel").style.display="";msg("拖动家具布置房间 ♡")}
$("tidyBtn").onclick=()=>{mode="tidy";$("tidyBtn").classList.add("on");$("decorateBtn").classList.remove("on");$("shopPanel").style.display="none";spawn()}
$("photoBtn").onclick=()=>{talk("茄子～ 📷");msg("V4 我们再给它做真正的拍照模式")}
room.onpointerdown=e=>{
  if(mode!=="decorate" || e.target.closest(".placed") || e.target.closest(".mess"))return;
  const r=room.getBoundingClientRect();go((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)
}
buildShop();renderItems();updateHUD();setTimeout(()=>talk("你好呀～"),400);
</script>
</body>
</html>
