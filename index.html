<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小莓的小屋</title>
<style>
:root{--bg:#fff4e0;--card:#fffdf7;--ink:#5a3e2b;--accent:#ff9f43;--line:#f0d9b5}
@media (prefers-color-scheme:dark){:root{--bg:#2b2118;--card:#3a2d21;--ink:#f6e6cf;--accent:#ffb25e;--line:#5a4632}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:640px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top b{font-size:18px}
.coins{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:3px 12px;font-weight:700}
button{font:inherit;color:var(--ink);background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:6px 10px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
#room{position:relative;width:100%;aspect-ratio:4/3;container-type:inline-size;border-radius:20px;overflow:hidden;border:4px dashed #fff;outline:3px solid var(--line);touch-action:none;user-select:none}
#wall{position:absolute;inset:0 0 45% 0}
#floor{position:absolute;inset:55% 0 0 0;border-top:4px solid rgba(0,0,0,.1)}
.it{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*1cqw);line-height:1;cursor:grab;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.it.sel{outline:2px dashed var(--accent);outline-offset:2px;border-radius:8px}
.mess{z-index:999;cursor:pointer;animation:w 1s infinite alternate}
@keyframes w{to{transform:translate(-50%,-50%) rotate(12deg)}}
#hero{position:absolute;width:17cqw;left:50%;top:80%;transform:translate(-50%,-92%);transition:left var(--d,.5s) ease-in-out,top var(--d,.5s) ease-in-out;pointer-events:none}
#hero .fl{transition:transform .15s}
#hero svg{display:block;width:100%;overflow:visible;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite alternate}
#hero.walk svg{animation:bob .28s ease-in-out infinite alternate}
@keyframes idle{to{transform:scale(1.03,.97)}}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-6%) rotate(4deg)}}
#bub{position:absolute;left:50%;bottom:104%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#5a3e2b;border:2px dashed #f4b6c2;border-radius:14px;padding:2px 8px;font-size:calc(2.6cqw + 4px);opacity:0;transition:opacity .2s}
#bar{min-height:40px;display:flex;gap:6px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap;font-size:14px}
#msg{text-align:center;min-height:22px;font-weight:700}
.cats{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto}.cats button{white-space:nowrap}
#shop{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;min-height:80px}
.p{display:flex;flex-direction:column;align-items:center;width:64px;font-size:12px}.p span{font-size:30px}
.sw{width:44px;height:44px;border-radius:50%;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>🍓 小莓的小屋</b><span class="coins">🪙 <span id="coins">0</span></span></div>
  <div class="tabs"><button id="m1" class="on">🛋️ 装饰</button><button id="m2">🧹 收拾</button></div>
  <div id="room"><div id="wall"></div><div id="floor"></div>
    <div id="hero"><div id="bub"></div><div class="fl">
<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
<defs>
 <filter id="fz" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
  <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".25"/>
 </filter>
 <radialGradient id="gw" cx="40%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ece4dc"/></radialGradient>
 <radialGradient id="gy" cx="40%" cy="25%"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#f7d95c"/></radialGradient>
 <radialGradient id="gp" cx="40%" cy="30%"><stop offset="0" stop-color="#ffc4d0"/><stop offset="1" stop-color="#f59db0"/></radialGradient>
</defs>
<ellipse cx="50" cy="126" rx="26" ry="4" fill="rgba(0,0,0,.15)"/>
<g filter="url(#fz)">
 <ellipse cx="38" cy="116" rx="11" ry="9" fill="url(#gw)"/><ellipse cx="62" cy="116" rx="11" ry="9" fill="url(#gw)"/>
 <ellipse cx="50" cy="96" rx="24" ry="24" fill="url(#gw)"/>
 <ellipse cx="24" cy="92" rx="8" ry="12" fill="url(#gw)" transform="rotate(20 24 92)"/><ellipse cx="76" cy="92" rx="8" ry="12" fill="url(#gw)" transform="rotate(-20 76 92)"/>
 <circle cx="22" cy="20" r="12" fill="url(#gp)"/><circle cx="78" cy="20" r="12" fill="url(#gp)"/>
 <circle cx="22" cy="21" r="6" fill="#ee8ba2"/><circle cx="78" cy="21" r="6" fill="#ee8ba2"/>
 <ellipse cx="50" cy="46" rx="38" ry="34" fill="url(#gy)"/>
 <ellipse cx="50" cy="58" rx="28" ry="23" fill="url(#gw)"/>
 <path d="M14 50 Q50 6 86 50 Q50 32 14 50Z" fill="url(#gy)"/>
 <path d="M16 48 Q50 10 84 48" fill="none" stroke="#e8b93a" stroke-width="1.2" stroke-dasharray="3 2.5" opacity=".8"/>
 <ellipse cx="50" cy="60" rx="28" ry="23" fill="none" stroke="#f7d95c" stroke-width="2"/>
 <g transform="translate(27 36)"><ellipse cx="0" cy="3" rx="6" ry="7" fill="#f0525f"/><path d="M-5 -2 L0 1 L5 -2 L0 -5Z" fill="#5cb85c"/><circle cx="-2" cy="3" r=".8" fill="#ffd"/><circle cx="2" cy="5" r=".8" fill="#ffd"/></g>
 <g transform="translate(73 36)"><ellipse cx="0" cy="3" rx="6" ry="7" fill="#f0525f"/><path d="M-5 -2 L0 1 L5 -2 L0 -5Z" fill="#5cb85c"/><circle cx="-2" cy="3" r=".8" fill="#ffd"/><circle cx="2" cy="5" r=".8" fill="#ffd"/></g>
 <ellipse cx="39" cy="58" rx="2.8" ry="3.6" fill="#3a2a2a"/><ellipse cx="61" cy="58" rx="2.8" ry="3.6" fill="#3a2a2a"/>
 <circle cx="38" cy="56.8" r=".9" fill="#fff"/><circle cx="60" cy="56.8" r=".9" fill="#fff"/>
 <ellipse cx="31" cy="65" rx="5" ry="3" fill="#ffb3c1" opacity=".7"/><ellipse cx="69" cy="65" rx="5" ry="3" fill="#ffb3c1" opacity=".7"/>
 <ellipse cx="50" cy="63" rx="3.2" ry="2.4" fill="#f28ea3"/><path d="M47 68 Q50 71 53 68" fill="none" stroke="#b56a78" stroke-width="1.2" stroke-linecap="round"/>
 <path d="M30 78 Q50 90 70 78 L50 104Z" fill="url(#gy)"/><path d="M32 79 Q50 90 68 79" fill="none" stroke="#e8b93a" stroke-width="1" stroke-dasharray="2.5 2"/>
 <rect x="56" y="88" width="8" height="5" rx="1.5" fill="#7cc4f0" transform="rotate(-15 60 90)"/>
</g></svg></div></div>
  </div>
  <div id="bar"></div><div id="msg"></div>
  <div id="panel"><div class="cats" id="cats"></div><div id="shop"></div></div>
</div>
<script>
const CAT={
 "家具":[["🛏️",30,22],["🛋️",25,20],["🪑",10,10],["📺",30,12],["🗄️",20,14],["🎹",40,16],["🛁",35,18]],
 "装饰":[["🖼️",8,10],["🪞",15,10],["🕰️",12,7],["💡",10,7],["🧸",5,7],["🎈",6,8],["📚",8,8]],
 "植物":[["🪴",8,10],["🌵",5,8],["🌻",6,9],["🌷",6,7],["🍓",5,7],["🐱",20,9]],
 "墙纸":["#ffd6e0","#cfeaff","#fff2b3","#d5f5d0","#e7d9ff","#f7c59f"],
 "地板":["#d9a066","#b98a5a","#f0d9b5","#9fc5a0","#c9b5e8","#8fb8de"]
};
const MESS=["🧦","🍎","📦","🗑️","🥤","📄","👕"];
const LINES=["收拾收拾~","这里好乱呀","嘿咻嘿咻","擦擦擦","要干净啦!"];
let S={coins:100,wall:"#ffd6e0",floor:"#d9a066",items:[]},sel=null,mode=1,mess=[],cat="家具",uid=1,hero={x:50,y:80};
try{const d=JSON.parse(localStorage.getItem("cozy2")||"null");if(d&&d.items){S=d;uid=Math.max(1,...S.items.map(i=>i.id+1))}}catch(e){}
const $=id=>document.getElementById(id),room=$("room"),H=$("hero");
function save(){try{localStorage.setItem("cozy2",JSON.stringify(S))}catch(e){}}
function say(t){$("msg").textContent=t}
function talk(t){const b=$("bub");b.textContent=t;b.style.opacity=1;clearTimeout(talk.t);talk.t=setTimeout(()=>b.style.opacity=0,2200)}
function go(x,y,cb){
 y=Math.max(58,Math.min(94,y));x=Math.max(8,Math.min(92,x));
 const dx=x-hero.x,d=Math.hypot(dx,y-hero.y),t=Math.max(.25,d/45);
 if(Math.abs(dx)>1)H.querySelector(".fl").style.transform=dx<0?"scaleX(-1)":"";
 H.style.setProperty("--d",t+"s");H.style.left=x+"%";H.style.top=y+"%";H.style.zIndex=Math.round(y);
 hero={x,y};H.classList.add("walk");clearTimeout(go.t);
 go.t=setTimeout(()=>{H.classList.remove("walk");cb&&cb()},t*1000);
}
function render(){
 $("wall").style.background=S.wall;$("floor").style.background=S.floor;$("coins").textContent=S.coins;
 room.querySelectorAll(".it").forEach(n=>n.remove());
 S.items.forEach(i=>{const n=document.createElement("div");n.className="it"+(i.id===sel?" sel":"");
  n.textContent=i.e;n.style.cssText+=`left:${i.x}%;top:${i.y}%;--s:${i.s};z-index:${Math.round(i.y)}`;
  if(i.f)n.style.transform="translate(-50%,-50%) scaleX(-1)";
  n.onpointerdown=e=>drag(e,i);room.appendChild(n)});
 mess.forEach(m=>{const n=document.createElement("div");n.className="it mess";n.textContent=m.e;
  n.style.cssText+=`left:${m.x}%;top:${m.y}%;--s:7`;
  n.onpointerdown=e=>{e.stopPropagation();go(m.x,m.y+3,()=>{if(mess.includes(m))tidy(m)})};room.appendChild(n)});
 bar();
}
function btn(t,f){const b=document.createElement("button");b.textContent=t;b.onclick=f;return b}
function bar(){
 const b=$("bar");b.innerHTML="";
 if(mode===2){b.append(btn("🌀 弄乱一下",spawn));return}
 const i=S.items.find(i=>i.id===sel);
 if(!i){b.textContent="点地板让小莓走路;点选物品可移动、缩放、卖掉";return}
 b.append(btn("➕",()=>{i.s=Math.min(40,i.s+2);upd()}),btn("➖",()=>{i.s=Math.max(4,i.s-2);upd()}),
  btn("↔️ 翻转",()=>{i.f=!i.f;upd()}),btn("🗑️ 卖掉",()=>{S.items=S.items.filter(o=>o!==i);S.coins+=5;sel=null;upd()}));
}
function upd(){save();render()}
function drag(e,i){
 if(mode!==1)return;e.preventDefault();e.stopPropagation();sel=i.id;const r=room.getBoundingClientRect();
 const mv=ev=>{i.x=Math.max(3,Math.min(97,(ev.clientX-r.left)/r.width*100));i.y=Math.max(3,Math.min(97,(ev.clientY-r.top)/r.height*100));
  const n=room.querySelector(".it.sel");if(n){n.style.left=i.x+"%";n.style.top=i.y+"%";n.style.zIndex=Math.round(i.y)}};
 const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);save()};
 addEventListener("pointermove",mv);addEventListener("pointerup",up);render();
}
function spawn(){
 if(mess.length){say("先把地上的收拾完吧!");return}
 for(let k=0;k<6;k++)mess.push({e:MESS[Math.floor(Math.random()*MESS.length)],x:8+Math.random()*84,y:62+Math.random()*28});
 say("哎呀,屋子乱了!点杂物,小莓会跑去收拾");talk("哇,好乱!");render();
}
function tidy(m){
 mess=mess.filter(o=>o!==m);S.coins+=5;save();
 if(mess.length){say(`+5 🪙 还剩 ${mess.length} 件`);talk(LINES[Math.floor(Math.random()*LINES.length)])}
 else{S.coins+=10;save();say("✨ 全部收拾干净啦!奖励 +10 🪙");talk("干净啦~ ♪")}
 render();
}
function shop(){
 const c=$("cats");c.innerHTML="";
 Object.keys(CAT).forEach(k=>{const b=btn(k,()=>{cat=k;shop()});if(k===cat)b.className="on";c.append(b)});
 const s=$("shop");s.innerHTML="";
 if(cat==="墙纸"||cat==="地板"){
  CAT[cat].forEach(col=>{const b=btn("",()=>{S[cat==="墙纸"?"wall":"floor"]=col;upd()});b.className="sw";b.style.background=col;s.append(b)});return}
 CAT[cat].forEach(([e,p,sz])=>{const d=document.createElement("div");d.className="p";
  d.innerHTML=`<span>${e}</span>🪙${p}`;const b=btn("买",()=>buy(e,p,sz));b.style.padding="2px 10px";d.append(b);s.append(d)});
}
function buy(e,p,sz){
 if(S.coins<p){say("金币不够啦,去收拾屋子赚一点吧~");talk("金币不够…");return}
 S.coins-=p;const i={id:uid++,e,x:50,y:cat==="装饰"?30:70,s:sz,f:false};S.items.push(i);sel=i.id;say("买到啦!拖动它摆放吧");talk("新东西!");upd();
}
function setMode(m){mode=m;$("m1").className=m===1?"on":"";$("m2").className=m===2?"on":"";$("panel").style.display=m===1?"":"none";say("")}
$("m1").onclick=()=>{setMode(1);render()};$("m2").onclick=()=>{setMode(2);render()};
room.onpointerdown=e=>{
 const r=room.getBoundingClientRect();
 if(e.target===room||e.target.id==="wall"||e.target.id==="floor"){
  sel=null;render();
  if(e.target.id==="floor")go((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);
 }
};
H.style.zIndex=80;shop();render();talk("你好呀~");
</script>
</body>
</html>
